
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municípios do Nordeste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="cabecalho text-center">
        <div class="container">
            <h1>Municípios do Nordeste</h1>
            <p>Gerenciamento de Municípios (Base em Memória)</p>
        </div>
    </header>
    <main class="container mt-4">
        <section class="row mb-4">
            <div class="col-md-3">
                <div class="card p-3">
                    <strong>Região:</strong>
                    Nordeste
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <strong>País:</strong>
                    Brasil
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <strong>Total:</strong>
                    <span id="totalMunicipios">0</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <strong>Fonte:</strong>
                    IBGE
                </div>
            </div>
        </section>

        <div class="row">
            <div class="col-md-6">
                <div class="card">

                    <div class="card-header">
                        <h3>Cadastrar / Atualizar Município</h3>
                    </div>

                    <div class="card-body">
                        <form id="formMunicipio">
                            <div class="mb-3">

                                <label for="nome" class="form-label">
                                    Nome do Município
                                </label>
                                <input type="text" id="nome" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="id_ibge" class="form-label">
                                    ID IBGE
                                </label>
                                <input type="number" id="id_ibge" class="form-control" required>
                            </div>
                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="estado" class="form-label">
                                        Estado
                                    </label>

                                    <input type="text" id="estado" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="sigla_uf" class="form-label">
                                        UF
                                    </label>
                                    <input type="text" id="sigla_uf" class="form-control" maxlength="2" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="populacao" class="form-label">
                                    População Estimada
                                </label>
                                <input type="number" id="populacao" class="form-control" required>
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" id="capital" class="form-check-input">
                                <label for="capital" class="form-check-label">
                                    Capital?
                                </label>
                            </div>
                            <button type="submit" class="btn btn-success">
                                Salvar / Atualizar
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="limparFormulario()">
                                Limpar
                            </button>

                        </form>
                    </div>
                </div>
            </div>

            <!-- municípios lista-->

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Lista de Municípios</h3>
                    </div>
                    <div class="card-body">

                        <!-- os filtros -->

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="buscaNome" class="form-label">
                                    Buscar município
                                </label>
                                <input type="text" id="buscaNome" class="form-control"
                                    placeholder="Nome do município">

                                <button class="btn btn-primary mt-2" onclick="buscarPorNome()">
                                    Buscar
                                </button>
                            </div>
                            <div class="col-md-6">
                                <label for="filtroUF" class="form-label">
                                    Filtrar por UF
                                </label>
                                <input type="text" id="filtroUF" class="form-control"
                                    placeholder="Ex: CE" maxlength="2">
                                <button class="btn btn-primary mt-2" onclick="filtrarPorUF()">
                                    Filtrar
                                </button>
                            </div>
                        </div>
                        <button class="btn btn-success mb-3" onclick="limparFiltros()">
                            Mostrar todos
                        </button>

                        <!-- a tabela -->

                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>UF</th>
                                        <th>Capital</th>
                                        <th>População</th>
                                        <th>ID IBGE</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaMunicipios">
                                </tbody>
                            </table>
                        </div>
                        <p id="mensagem" class="text-center"></p>
                        <a href="/municipios/json" class="btn btn-outline-primary">
                            Baixar JSON
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="text-center mt-4 p-3">
        Desenvolvido em Flask | Manipulação de Dicionários
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
